name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      DOCC_HOSTING_BASE_PATH: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build DocC site
        run: |
          swift package generate-documentation \
            --target iPodKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "${DOCC_HOSTING_BASE_PATH}" \
            --warnings-as-errors \
            --output-path .build/documentation

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/documentation

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
